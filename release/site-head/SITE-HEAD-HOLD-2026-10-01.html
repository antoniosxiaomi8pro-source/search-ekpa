<!-- EKPA Smart Finder — optional "hold" for the search results page. 2026-10-01
     WHERE: in the <head> of EVERY page of elearningekpa.gr, ABOVE the Google Tag Manager snippet.
     WHAT IT DOES: only on /search?q=... it hides the website's own result list until the
     Smart Finder takes over. Nothing else on the site is touched.
     SAFE: if Smart Finder / GTM does not load, the list comes back by itself after 3 seconds.
     TO REMOVE: delete these lines. Nothing else depends on them. -->
<style>html.sf-hold main.content--search .container--search-results{visibility:hidden}html.sf-hold .search-overview__title,html.sf-hold .search-overview__query,html.sf-hold .search-overview__tagline{display:none}</style>
<script>(function(){try{var l=window.location;if(l.pathname==="/search"&&/[?&]q=[^&]/.test(l.search)){var d=document.documentElement;d.className+=" sf-hold";setTimeout(function(){d.className=d.className.replace(/(^|\s)sf-hold(\s|$)/g," ")},3000)}}catch(e){}})()</script>
